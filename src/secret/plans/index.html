<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans...</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/secret/secretstyles.css">
    <script src="/navigation.js" defer></script>
</head>

<body class="serif serif16">

    <nav class="navbar nav_font">
        <div class="mobile-menu">
            <button class="mobile-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation"><span></span><span></span><span></span></button>
            <div class="nav-links nav_font" id="primary-navigation">
            <a href="/secret/" class="serif15">Home</a>
            <a href="/secret/plans/" class="active serif15">Plans</a>
            <a href="/secret/places/" class="serif15">Places</a>
            <a href="/secret/notes/" class="serif15">Notes</a>
            </div>
        </div>
    </nav>

    <main class="container">
    
        <section class="content-card">
            <h2 class="heading_font serif24">Add a New Plan</h2>
            <form id="planForm">
                <input type="text" id="todo" placeholder="Things to Do" required class="serif serif13">
                <textarea id="details" placeholder="Details" required class="serif serif13"></textarea>
                <input type="text" id="when" placeholder="When is it?" required class="serif serif13">
                <input type="text" id="signature" placeholder="Your Name" required class="serif serif13">
                <button type="submit" class="btn serif serif13" id="submitBtn">Save Plan</button>
            </form>
        </section>

        <section class="content-card">
            <h2 class="heading_font serif24">Recent Plans</h2>
            <div id="plansList">Loading...</div>
        </section>
    </main>


<script>
const form = document.getElementById('planForm');
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        todo: document.getElementById('todo').value,
        details: document.getElementById('details').value,
        when: document.getElementById('when').value,
        signature: document.getElementById('signature').value
    };
    await fetch('/api/save-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    form.reset();
    loadPlans();
});

async function loadPlans() {
    const res = await fetch('/api/get-plans');
    const plans = await res.json();
    document.getElementById('plansList').innerHTML = plans.map(p => `
        <div class="note-item">
            <strong>${p[0]}</strong> - <em>${p[2]}</em><br>
            <p>${p[1]}</p>
            <small class="serif13">By: ${p[3]}</small>
        </div>
    `).join('');
}
loadPlans();
</script>


</body>
</html>
