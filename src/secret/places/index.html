<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Places To Go...</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/secret/secretstyles.css">
</head>
<body class="serif serif16">
    
    <nav class="navbar nav_font">
        <details class="mobile-menu">
            <summary><span class="mobile-menu-summary-text">Navigation menu</span><span></span><span></span><span></span></summary>
            <div class="nav-links nav_font">
            <a href="/secret/" class="serif15">Home</a>
            <a href="/secret/plans/" class="serif15">Plans</a>
            <a href="/secret/places/" class="active serif15">Places</a>
            <a href="/secret/notes/" class="serif15">Notes</a>
            </div>
        </details>
    </nav>

    <main class="container"> 
        <section class="content-card">
            <h2 class="heading_font serif24">Add a New Place</h2>
            <form id="placeForm">
                <input type="text" id="name" placeholder="Place Name" class="serif serif13">
                <textarea id="comment" placeholder="Comment" class="serif serif13"></textarea>
                <input type="url" id="image" placeholder="Image Link" class="serif serif13">
                <input type="text" id="person" placeholder="Your Name" class="serif serif13">
                <button type="submit" class="btn serif serif13" id="submitBtn">Save Place</button>
            </form>
        </section>

        <section class="content-card">
            <h2 class="heading_font serif24">Recent Places</h2>
            <div id="placesList">Loading...</div>
            <div id="pagination" class="pagination"></div>
        </section>
    </main>

<script>
const form = document.getElementById('placeForm');
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        name: document.getElementById('name').value,
        comment: document.getElementById('comment').value,
        image: document.getElementById('image').value,
        person: document.getElementById('person').value
    };
    await fetch('/api/save-place', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    form.reset();
    loadPlaces();
});

async function loadPlaces() {
    const response = await fetch('/api/get-places');
    const places = await response.json();
    const container = document.getElementById('placesList');
    // n[0]=Name, n[1]=Comment, n[2]=Image, n[3]=Person
    container.innerHTML = places.map(n => `
        <li style="margin-bottom: 20px;">
            <h3 class="heading_font serif19">${n[0]}</h3>
            <img src="${n[2]}" style="max-width:200px;"><br>
            <p>${n[1]}</p>
            <small class="serif13">By: ${n[3]}</small>
        </li>
    `).join('');
}
loadPlaces();
</script>

</body>
</html>
